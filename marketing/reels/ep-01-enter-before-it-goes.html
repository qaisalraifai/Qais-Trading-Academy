<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<title>QTA — الحلقة ٠١: ادخل قبل ما تروح</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Archivo:wght@600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="_base.css" />
<link rel="stylesheet" href="_series.css" />
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   الحلقة ٠١ — «ادخل قبل ما تروح»  ·  1080×1920  ·  ٤٢ ثانية
   ---------------------------------------------------------------------------
   المصدر: بنك السيناريوهات `#1` — «الخوف من فوات الفرصة».
   قائمة اللقطات مكتوبة بـ`bible/05-first-10.md` تحت رقم ٠١.

   ═══ ليش هالحلقة أول ═══
   الغلطة اللي عملها **كل مشاهد**. لو بلّشنا بمفهوم تقني، بنخسر اللي لسا
   ما وصلوا لمرحلة المفاهيم. الـFOMO بيعرفها الكل حتى لو ما بيعرف اسمها.

   ═══ ثلاث قواعد مطبَّقة ═══
   🔴 **ريان ما بيقول «لا تدخل».** بيسأل «وين خطتك؟». شروط المنصّة بتقول
      «لا نقدّم توصيات أو إشارات» — فشخصية بتعطي أوامر دخول بتناقضها.
      (`bible/03-characters-world.md`)

   ⚠️ **السكون هو المشهد.** ٤ ثواني على ظل آدم بلا صوت ولا نص (٣٢→٣٦) —
      هون بيشوف المشاهد حاله. أي نص هون بيقتل اللحظة.

   ⚠️ **قاعدة زمن القراءة**: 0.6 + (الكلمات ÷ 2) · الحد الأدنى ٢.٠ث.
      كل سطر حوار محسوب تحت.

   التوقيت:
     0.0 –  4.0   الغرفة · الظل · الشاشة       (بلا نص — تأسيس)
     4.0 –  7.5   الشمعة بتندفع                (بلا نص)
     7.5 – 11.5   آدم: «ادخل قبل ما تروح!»      ٤ كلمات · لازم ٢.٦
    11.5 – 15.0   السعر بينعكس فوراً             (بلا نص — الصوت بيقطع)
    15.0 – 19.5   ريان: «وين خطتك؟»              ٢ كلمة · لازم ٢.٠
    19.5 – 23.5   آدم: «ما في وقت.»              ٣ كلمات · لازم ٢.١
    23.5 – 31.5   تبعيد — السياق بينكشف          ٣ كلمات · لازم ٢.١
    31.5 – 36.0   ريان: «الوقت كان موجود...»     ٨ كلمات · لازم ٤.٦
    36.0 – 40.0   سكون على آدم                   🔴 اللقطة الأهم
    40.0 – 48.0   الختام + TO BE CONTINUED
   ═══════════════════════════════════════════════════════════════════════════ */

/* ── المشهد الأول: الغرفة ── */
#s1{animation:sceneIn 1.2s .2s both, sceneOut .6s 39.4s both}

/* الظل بيدخل بزحف بطيء — بيقول «إحنا بغرفة» بلا ما يشرح */
.figure{opacity:0;animation:fadeIn 1.6s .4s both, drift 44s .4s both linear}
@keyframes drift{from{transform:translateX(-50%) scale(1)}to{transform:translateX(-50%) scale(1.05)}}

.monitor{opacity:0;animation:fadeIn 1.2s .9s both}

/* ── الشموع ── */
.c{opacity:0;animation:pop .3s both var(--orbit)}

/* ── الشمعة الكبيرة اللي بتشدّ آدم ── */
.bigCandle{opacity:0;animation:pop .45s 4.6s both var(--orbit)}
.pull{position:absolute;inset:0;opacity:0;pointer-events:none;
  background:radial-gradient(30% 20% at 72% 46%, rgba(124,77,255,.5), transparent 62%);
  animation:fadeIn .5s 4.8s both, fadeOut .6s 11.4s forwards}

/* ── الانعكاس ── */
.reverse{opacity:0;animation:pop .3s both var(--orbit)}
/* وميض أحمر واحد وبس عند الانعكاس — 🔴 الأحمر للنتيجة مش للزخرفة */
.hit{position:absolute;inset:0;opacity:0;pointer-events:none;
  background:radial-gradient(50% 30% at 50% 50%, rgba(255,69,58,.22), transparent 64%);
  animation:fadeIn .18s 11.6s both, fadeOut 1.2s 12.2s forwards}

/* ── الحوار ── */
#d1{animation:riseIn .7s 7.7s both var(--orbit), fadeOut .5s 11.0s forwards}
#d2{animation:riseIn .7s 15.2s both var(--orbit), fadeOut .5s 19.0s forwards}
#d3{animation:riseIn .7s 19.7s both var(--orbit), fadeOut .5s 23.0s forwards}
#d4{animation:riseIn .8s 31.7s both var(--orbit), fadeOut .5s 35.5s forwards}

/* ── التبعيد: السياق بينكشف ──
   ⚠️ **هون الدرس البصري كله.** الشمعة اللي شدّت آدم كانت **آخر** حركة
   بموجة طويلة مش أولها. التبعيد بيكشفها بلا ما حدا يشرح. */
.wide{opacity:0;animation:pop .3s both var(--orbit)}
.ctxNote{top:60px;right:60px;color:var(--muted);
  animation:riseIn .7s 27.0s both var(--orbit), fadeOut .5s 31.0s forwards}
#s1 .monitor{animation:fadeIn 1.2s .9s both, zoomOut 2.4s 23.7s both var(--orbit)}
@keyframes zoomOut{from{transform:translateX(-50%) scale(1)}
  to{transform:translateX(-50%) scale(.82)}}

/* ── السكون على آدم ──
   🔴 ولا نص ولا حركة. ٤ ثواني. هاي الحلقة كلها. */
.hold{position:absolute;inset:0;opacity:0;pointer-events:none;
  background:radial-gradient(38% 22% at 50% 62%, rgba(124,77,255,.14), transparent 66%);
  animation:fadeIn 1.2s 36.0s both}

/* ── الختام ── */
#s2{animation:sceneIn 1.0s 40.0s both}
#s2 .mark{animation:markIn 1.2s 40.4s both var(--orbit)}
#s2 .brand{animation:riseIn .8s 41.2s both var(--orbit)}
#s2 .brandsub{animation:riseIn .8s 41.5s both var(--orbit)}
#s2 .tbc{margin-top:64px;animation:riseIn .9s 42.4s both var(--orbit)}
#s2 .url{animation:riseIn .8s 43.6s both var(--orbit)}
#s2 .disc{animation:fadeIn .9s 44.4s both}
</style>
</head>
<body>
<div class="stage">

  <section class="scene" id="s1">
    <div class="room">
      <div class="dark"></div>
      <div class="window"></div>
      <div class="screenGlow"></div>
    </div>

    <!-- ═══ الشاشة ═══ -->
    <div class="monitor">
      <div class="bezel"></div>
      <svg viewBox="0 0 800 500" preserveAspectRatio="none" id="chart"></svg>
      <div class="note ctxNote">SAME MOVE — LATER</div>
      <div class="pull"></div>
      <div class="hit"></div>
    </div>

    <!-- ═══ الظل ═══
         ⚠️ الأشكال بسيطة عمداً: رأس وكتفان وذراع على الماوس. التفصيل
         الزائد بيحوّل الظل لشخصية كرتونية — وهو بالضبط اللي منعه. -->
    <div class="figureGlow"></div>
    <div class="figure">
      <svg viewBox="0 0 1080 620" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
            <stop stop-color="#7C4DFF" stop-opacity=".85"/>
            <stop offset="1" stop-color="#7C4DFF" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <!-- المكتب -->
        <rect x="0" y="520" width="1080" height="100" fill="#050308"/>
        <rect x="0" y="518" width="1080" height="2" fill="url(#rim)" opacity=".6"/>
        <!-- الجذع والكتفان -->
        <path d="M292 620 C308 472 414 414 540 414 C666 414 772 472 788 620 Z" fill="#010005"/>
        <!-- الرأس -->
        <ellipse cx="540" cy="340" rx="82" ry="94" fill="#010005"/>
        <!-- ضوء الحافة من الشاشة — أقوى، وهو اللي بيفصل الشكل عن العتمة -->
        <path d="M292 620 C308 472 414 414 540 414" stroke="#C4B0FF" stroke-width="4" opacity=".7"/>
        <path d="M458 340 A82 94 0 0 1 540 246" stroke="#C4B0FF" stroke-width="4" opacity=".62"/>
        <path d="M540 246 A82 94 0 0 1 616 316" stroke="#7C4DFF" stroke-width="3" opacity=".3"/>
        <!-- الذراع على الماوس -->
        <path d="M694 566 C728 530 764 526 796 542" stroke="#010005" stroke-width="44" stroke-linecap="round"/>
        <path d="M694 566 C728 530 764 526 796 542" stroke="#7C4DFF" stroke-width="2.5" opacity=".45"/>
      </svg>
    </div>

    <div class="hold"></div>

    <!-- ═══ الحوار ═══ -->
    <div class="line adam" id="d1">
      <span class="who">آدم</span>
      <span class="txt">ادخل قبل ما تروح!</span>
    </div>
    <div class="line ryan" id="d2">
      <span class="who">ريان</span>
      <span class="txt">وين خطتك؟</span>
    </div>
    <div class="line adam" id="d3">
      <span class="who">آدم</span>
      <span class="txt">ما في وقت.</span>
    </div>
    <div class="line ryan" id="d4">
      <span class="who">ريان</span>
      <span class="txt">الوقت كان موجود.<br />القرار هو اللي ما كان.</span>
    </div>
  </section>

  <!-- ═══ الختام ═══ -->
  <section class="scene" id="s2">
    <svg class="mark" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="q" x1="6" y1="4" x2="42" y2="44" gradientUnits="userSpaceOnUse">
          <stop stop-color="#7C4DFF"/><stop offset=".45" stop-color="#9F6CFF"/><stop offset="1" stop-color="#22D3EE"/>
        </linearGradient>
        <linearGradient id="qc" x1="18" y1="18" x2="30" y2="30" gradientUnits="userSpaceOnUse">
          <stop stop-color="#C4B0FF"/><stop offset="1" stop-color="#22D3EE"/>
        </linearGradient>
      </defs>
      <circle cx="24" cy="24" r="14.5" stroke="url(#q)" stroke-width="2.6"/>
      <path d="M28 28 L38 38" stroke="url(#q)" stroke-width="3" stroke-linecap="round"/>
      <ellipse cx="24" cy="24" rx="14.5" ry="5.4" stroke="url(#q)" stroke-width="1.2" opacity=".5" transform="rotate(-28 24 24)"/>
      <circle cx="24" cy="24" r="4.2" fill="url(#qc)"/>
    </svg>
    <div class="brand">QAIS TRADING</div>
    <div class="brandsub">A C A D E M Y</div>
    <div class="tbc">TO BE CONTINUED</div>
    <div class="url">qta-academy.store</div>
    <div class="disc">محتوى تعليمي فقط — لا يُعدّ نصيحة استثمارية، ولا نقدّم توصيات أو إشارات تداول.</div>
  </section>
</div>

<script>
let seed = 20260906;
const rnd = () => ((seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff);

/* ═══════════════════════════════════════════════════════════════════════════
   الشارت — تلات مراحل بنفس المصفوفة
   ---------------------------------------------------------------------------
   ⚠️ **مصفوفة وحدة مش تلاتة.** الشموع اللي بتظهر بالتبعيد هي **نفسها** اللي
   شافها آدم، بس بمقياس أوسع. لو ولّدت مصفوفة تانية للتبعيد، بيصير الدرس
   كذبة بصرية: «شوف السياق» بينما السياق شارت تاني أصلاً.

   المراحل:
     ١) ٢٦ شمعة عرضية        بتظهر 1.0 → 4.1
     ٢) شمعة كبيرة صاعدة      بتظهر 4.6      ← اللي شدّت آدم
     ٣) ٦ شموع انعكاس         بتظهر 11.6 → 12.5
     ٤) التبعيد: ٤٢ شمعة قبلهن بتنكشف 24.0 → 27.0
   ═══════════════════════════════════════════════════════════════════════════ */
(() => {
  const W = 800, H = 500;
  const PRE = 42, MID = 26, POST = 6;
  const N = PRE + MID + 1 + POST;
  const cw = (W - 40) / N;

  /* توليد السلسلة كاملة مرة وحدة */
  const bars = [];
  let p = 300;
  for (let i = 0; i < N; i++) {
    const isBig = i === PRE + MID;
    const isPost = i > PRE + MID;
    let d;
    if (isBig) d = 58;                              /* الشمعة اللي شدّته */
    else if (isPost) d = -(rnd() * 20 + 10);        /* الانعكاس */
    else if (i < PRE) d = (rnd() - 0.42) * 30;      /* الموجة الطويلة قبلها */
    else d = (rnd() - 0.5) * 16;                    /* العرضية اللي شافها */
    const open = p, close = p + d;
    bars.push({ open, close,
      hi: Math.max(open, close) + rnd() * 12,
      lo: Math.min(open, close) - rnd() * 12, isBig, isPost });
    p = close;
  }

  const min = Math.min(...bars.map(b => b.lo)), max = Math.max(...bars.map(b => b.hi));
  const TOP = 54, BOT = 54;
  const y = v => TOP + (1 - (v - min) / (max - min)) * (H - TOP - BOT);

  const draw = (b, i, cls, delay) => {
    const up = b.close >= b.open;
    const cx = 20 + i * cw + cw / 2, bw = Math.max(4, cw * 0.56);
    const yT = y(Math.max(b.open, b.close)), yB = y(Math.min(b.open, b.close));
    /* 🔴 الأحمر للنتيجة وبس — شموع الانعكاس هي النتيجة الفعلية لقراره. */
    const fill = b.isPost ? "#3A1218" : (up ? "#7C4DFF" : "#141024");
    const stroke = b.isPost ? "#FF453A" : (up ? "#C4B0FF" : "#8A7CB8");
    return `<g class="${cls}" style="animation-delay:${delay.toFixed(2)}s">
      <line x1="${cx}" y1="${y(b.hi)}" x2="${cx}" y2="${y(b.lo)}"
        stroke="${stroke}" stroke-width="1.8" opacity=".8"/>
      <rect x="${cx - bw/2}" y="${yT}" width="${bw}" height="${Math.max(3, yB - yT)}"
        fill="${fill}" stroke="${stroke}" stroke-width="1.3"/></g>`;
  };

  let out = "";
  /* ١ · العرضية اللي شافها آدم */
  bars.slice(PRE, PRE + MID).forEach((b, k) => out += draw(b, PRE + k, "c", 1.0 + k * 0.12));
  /* ٢ · الشمعة الكبيرة */
  out += draw(bars[PRE + MID], PRE + MID, "bigCandle", 0);
  /* ٣ · الانعكاس */
  bars.slice(PRE + MID + 1).forEach((b, k) => out += draw(b, PRE + MID + 1 + k, "reverse", 11.6 + k * 0.15));
  /* ٤ · التبعيد — الموجة اللي كانت قبل، بتنكشف من اليسار */
  bars.slice(0, PRE).forEach((b, k) => out += draw(b, k, "wide", 24.0 + k * 0.07));

  document.getElementById("chart").innerHTML = out;
})();
</script>
</body>
</html>
